AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Notification handler Lambda. Validates and normalizes a stream of user
  events (user_registered, password_reset, user_deleted, ...) and stores them
  as Notification rows in MySQL (simulated). Zero runtime dependencies.

Parameters:
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARN, ERROR]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: !Ref LogLevel

Resources:
  EventsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Callers sign requests with SigV4 (IAM). Swap for a JWT authorizer if the producer is not an AWS principal.
      Auth:
        EnableIamAuthorizer: true
        DefaultAuthorizer: AWS_IAM

  NotificationHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: app/
      Description: Validates, normalizes and stores user events as notifications.
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        PostEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref EventsHttpApi
            Path: /events
            Method: post

Outputs:
  NotificationHandlerFunctionArn:
    Value: !GetAtt NotificationHandlerFunction.Arn
  HttpApiEndpoint:
    Description: POST /events here (IAM-signed).
    Value: !Sub 'https://${EventsHttpApi}.execute-api.${AWS::Region}.amazonaws.com/events'
